<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI SOC Tool</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@materialstyle/materialstyle@3.1.1/dist/css/materialstyle.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="dark">
    <div class="scanline-overlay"></div>
    <div class="container">
        <h1 class="glitch" data-text="AI SOC Analyzer">AI SOC Analyzer</h1>
        <p>Paste a log line (firewall, SSH, web server, etc.) and let AI detect threats.</p>

        <div class="text-field-container">
            <textarea id="logInput" class="text-field" placeholder="Example: Oct 29 10:30:22 server sshd[1234]: Failed password for root from 192.168.1.100 port 2222 ssh2"></textarea>
        </div>

        <div class="button-container">
            <button class="filled-button" onclick="analyzeLog('gemini')">Analyze with Gemini AI</button>
            <button class="filled-button" onclick="analyzeLog('deepseek')">Analyze with DeepSeek</button>
            <button class="filled-button" onclick="analyzeLog('qwen')">Analyze with Qwen</button>
        </div>

        <div id="result" class="card"></div>
    </div>

    <script>
        async function analyzeLog(model) {
            const log = document.getElementById('logInput').value;
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.className = 'card error';
            resultDiv.innerHTML = '<b>? Analyzing...</b>';

            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ log: log, model: model })
                });

                const data = await response.json();

                if (response.ok) {
                    if (data.threat_detected) {
                        resultDiv.className = 'card threat';
                        resultDiv.innerHTML = `
                            <b style="font-size:22px; font-weight:bold; color:red;">⚠️🚨 Threat Detected!</b><br>
                            <b style="font-size:18px;">Type:</b><br> <span style="font-size:16px">${data.threat_type}</span> <br>
                            <b style="font-size:18px;">Confidence:</b><br> <span style="font-size:16px">${data.confidence}</span> <br>
                            <b style="font-size:18px;">Recommendation:</b><br> <span style="font-size:16px">${data.recommendation}</span> <br>
                            <b style="font-size:18px;">How to do:</b><br> <span style="font-size:16px">${data.how_to_do}</span>
                        `;
                    } else {
                        resultDiv.className = 'card safe';
                        resultDiv.innerHTML = `
                            <b style="font-size:22px; font-weight:bold;">✅🟢 No Threat Detected</b><br>
                            <b style="font-size:18px;">Recommendation:</b><br> <span style="font-size:16px">${data.recommendation}</span>
                        `;
                    }
                } else {
                    resultDiv.className = 'card error';
                    resultDiv.innerHTML = `<b>? Error:</b> ${data.error || 'Unknown error'}`;
                }
            } catch (err) {
                resultDiv.className = 'card error';
                resultDiv.innerHTML = `<b>? Network Error:</b> ${err.message}`;
            }
        }
    </script>
</body>
</html>
